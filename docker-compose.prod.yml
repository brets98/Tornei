# Production: docker compose -f docker-compose.prod.yml up -d
# Sized for a 1 GB server (e.g. Google Cloud's free e2-micro, with swap): container logs are
# rotated so they can't fill the disk. The database is MongoDB Atlas (MONGODB_URI in .env).

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  server:
    image: ghcr.io/brets98/tornei-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      target: prod
    restart: unless-stopped
    logging: *logging
    environment:
      MONGODB_URI: ${MONGODB_URI:?}
      BETTER_AUTH_URL: https://${DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?}

  # Dumps the Atlas database to ./backups now and then every 24 hours, keeping BACKUP_KEEP_DAYS days
  # (Atlas' free tier keeps no backups of its own). The image also has mongosh for admin tasks.
  # Restore: docker compose -f docker-compose.prod.yml exec -T backup
  #   bash -c 'mongorestore --uri="$MONGODB_URI" --drop --gzip --archive' < backups/<file>
  backup:
    image: mongo:8
    restart: unless-stopped
    logging: *logging
    environment:
      MONGODB_URI: ${MONGODB_URI:?}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        while true; do
          file="/backups/tornei-$$(date +%Y%m%d-%H%M%S).archive.gz"
          if mongodump --uri="$$MONGODB_URI" --gzip --archive="$$file" --quiet; then
            echo "Backup written: $$file"
          else
            echo "Backup failed" >&2
            rm -f "$$file"
            sleep 300
            continue
          fi
          find /backups -name 'tornei-*.archive.gz' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done

  web:
    image: ghcr.io/brets98/tornei-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: prod
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN:?}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  caddy-data:
  caddy-config:
