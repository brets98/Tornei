name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint & test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [client, server]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    name: Publish images (${{ matrix.image }})
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [server, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          target: prod
          push: true
          tags: |
            ghcr.io/brets98/tornei-${{ matrix.image }}:latest
            ghcr.io/brets98/tornei-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Cloud Run (see deploy/cloudrun/README.md). Skipped until the GCP_* repository
  # variables exist; authenticates without keys (Workload Identity Federation).
  deploy:
    name: Deploy to Cloud Run
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/tornei/tornei:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/cloudrun.Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=cloudrun
          cache-to: type=gha,mode=max,scope=cloudrun
      # Only the image changes: settings and secrets stay as setup.sh left them
      - run: gcloud run deploy tornei --image="$IMAGE" --region=${{ vars.GCP_REGION }} --quiet
